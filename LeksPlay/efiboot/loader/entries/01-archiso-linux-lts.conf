title    LeksOS install medium (%ARCH%, UEFI), LTS kernel
sort-key 01-lts
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-leksos-lts
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-leksos-lts.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=15G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes
