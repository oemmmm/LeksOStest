LABEL arch
TEXT HELP
Boot the LeksOS install medium on BIOS.
It allows you to install LeksOS or perform system maintenance.
ENDTEXT
MENU LABEL LeksOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-leksos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-leksos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G


# Spare LTS kernel: if the main one does not boot, and for installing on ZFS
LABEL leksos_lts
TEXT HELP
Boot the LeksOS install medium on BIOS with the LTS kernel.
Use it if the main kernel does not boot, or to install LeksOS on ZFS.
ENDTEXT
MENU LABEL LeksOS install medium (%ARCH%, BIOS), LTS kernel
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-leksos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-leksos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G
# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the LeksOS install medium on BIOS with speakup screen reader.
It allows you to install LeksOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL LeksOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-leksos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-leksos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G accessibility=on
