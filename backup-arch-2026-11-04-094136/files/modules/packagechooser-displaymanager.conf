# SPDX-License-Identifier: CC0-1.0
#
# LeksOS display-manager picker (pretty front page). method: netinstall-select
# pre-checks the matching group (matched BY NAME) on the
# netinstall-displaymanager.conf page right after -- see that file for the
# real package lists. screenshot paths are placeholders, swap the PNGs any
# time without touching this file.
---
mode: required
method: netinstall-select
labels:
    step: "Display manager"
    step[ru]: "Экранный менеджер"
default: plasma-login-manager

items:
    - id: plasma-login-manager
      name: "Plasma Login Manager"
      description: "Default Login Manager for Plasma"
      description[ru]: "Установлена по умолчанию в системе, обеспечивает наилучшую интеграцию."
      screenshot: "images/dm/plasmaloginmanager.png"
    - id: SDDM
      name: "SDDM"
      description: "SDDM (Simple Desktop Display Manager)"
      description[ru]: "Современный, гибко настраиваемый экранный менеджер, использует QML-темы."
      screenshot: "images/dm/sddm.png"
    - id: GDM
      name: "GDM"
      description: "GDM (GNOME Display Manager)"
      description[ru]: "Экранный менеджер для GNOME. Стабильный, надежный, глубоко интегрированный."
      screenshot: "images/dm/gdm.png"
    - id: LightDM
      name: "LightDM"
      description: "LightDM"
      screenshot: "images/dm/lightdm.png"
      description[ru]: "Легковесный, универсальный экранный менеджер. Быстрый и простой в настройке."
    - id: LXDM
      name: "LXDM"
      description: "LXDM"
      screenshot: "images/dm/lxdm.png"
      description[ru]: "Сильно легкий экранный менеджер для LXDE. Отлично подходит для старых ПК."
    - id: SLiM
      name: "SLiM"
      description: "SLiM (Simple Login Manager)"
      description[ru]: "Минималистичный, независимый, легковесный графический вход в систему."
      screenshot: "images/dm/slim.png"
