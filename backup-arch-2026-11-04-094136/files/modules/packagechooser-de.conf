# SPDX-License-Identifier: CC0-1.0
#
# LeksOS desktop-environment/window-manager picker (pretty front page).
# method: netinstall-select means picking an item here just pre-checks the
# matching group (matched BY NAME) on the netinstall-de.conf page right after
# -- that page still does the actual install job. See netinstall-de.conf for
# the real package lists; keep item id/name here in sync with the group names
# there if you ever rename one.
#
# screenshot: paths are placeholders (calamares-branding/default/images/de/*.png,
# generated flat-color placeholders) -- swap them for real screenshots any time,
# same filenames, no config change needed.
#
# mode: optional (zero-or-one) -- exclusive, radio-button-style: picking a
# different DE deselects the previous one. Unlike display manager/bootloader
# (still optionalmultiple, multiple is normal there), a desktop is meant to
# be a single primary choice here. This uses Calamares' plain SingleSelection
# widget mode, no code patch needed.
---
mode: required
method: netinstall-select
labels:
    step: "Desktop"
    step[ru]: "Рабочий стол"
default: Plasma

items:
    - id: Plasma
      name: "KDE Plasma"
      description: "Set as default in the system, Recommended first choice for beginners as their first desktop environment looking like Windows."
      description[ru]: "Установлена по умолчанию в системе. Рекомендованный вариант для новичков в качестве их первой графической оболочки, напоминающей Windows."
      screenshot: "images/de/plasma.png"
    - id: GNOME
      name: "GNOME"
      description: "The shell itself is minimalist, better suited for laptops. Recommended if you want something looking like macOS."
      description[ru]: "Сама по себе оболочка минималистична и подходит больше всего для ноутбуков. Рекомендуется, если вы хотите что-то более похожее на macOS."
      screenshot: "images/de/gnome.png"
    - id: XFCE
      name: "XFCE"
      description: "Lightweight environment, perfectly suited for servers."
      description[ru]: "Легкая оболочка, отлично подойдет для серверов."
      screenshot: "images/de/xfce.png"
    - id: Cinnamon
      name: "Cinnamon"
      description: "Based on GNOME 3. Comfortable, includes applets, lightweight, and free of bloatware."
      description[ru]: "Основан на GNOME 3. Комфортный, есть апплеты, легковесный, без раздутых программ."
      screenshot: "images/de/cinnamon.png"
    - id: MATE
      name: "MATE"
      description: "Based on GNOME 2. Somewhat reminiscent of XFCE. Intuitive and comfortable."
      description[ru]: "Основан на GNOME 2. Чем-то напоминает XFCE. Интуитивно понятное и удобное окружение."
      screenshot: "images/de/mate.png"
    - id: Budgie
      name: "Budgie"
      description: "Modern, elegant, not cluttered with details, looks clean."
      description[ru]: "Современный, элегантный, не перегруженный деталями интерфейс, выглядит чисто."
      screenshot: "images/de/budgie.png"
    - id: LXQt
      name: "LXQt"
      description: "Best suited for older PCs. Was developed from LXDE. Almost everything be customized."
      description[ru]: "Больше всего подходит для стареньких ПК. Был создан на базе LXDE. Можно кастомизировать почти всё."
      screenshot: "images/de/lxqt.png"
    - id: LXDE
      name: "LXDE"
      description: "Its best suited for very old PCs or for servers. As for customization... well, it exists - to an extent."
      description[ru]: "Больше всего подходит для очень старых ПК или для серверов. Кастомизация... она есть, отчасти."
      screenshot: "images/de/lxde.png"
    - id: Deepin
      name: "Deepin"
      description: "A shell from China, very reminiscent of macOS."
      description[ru]: "Оболочка из Китая, очень сильно напоминает macOS."
      screenshot: "images/de/deepin.png"
    - id: COSMIC
      name: "COSMIC"
      description: "Something between a tiling environment and a full desktop environment."
      description[ru]: "Что-то между тайлинговым и полноценным рабочим окружением."
      screenshot: "images/de/cosmic.png"
    - id: Enlightenment
      name: "Enlightenment"
      description: "A very lightweight DE and WM with advanced visual effects and deep customization. Runs flawlessly on extremely old hardware."
      description[ru]: "Очень легкая графическая оболочка и оконный менеджер со множеством визуальных эффектов и глубокой кастомизацией. Отлично работает на очень старом железе."
      screenshot: "images/de/enlightenment.png"
    - id: Pantheon
      name: "Pantheon"
      description: "Based on Vala and GTK, it features a minimalist design with a top panel and a bottom dock."
      description[ru]: "Основана на Vala и GTK, отличается минималистичным дизайном, наличием верхней панели и нижнего дока."
      screenshot: "images/de/pantheon.png"
    - id: Sugar
      name: "Sugar"
      description: "A specialized learning environment created for children. Added just for fun."
      description[ru]: "Специализированная среда, созданная для обучения детей. Добавлена просто ради прикола."
      screenshot: "images/de/sugar.png"
    - id: Hyprland
      name: "Hyprland"
      description: "A dynamic tiling Wayland compositor with fluid visual effects. Highly customizable down to the smallest detail."
      description[ru]: "Динамический тайлинговый композитор Wayland с плавными визуальными эффектами. Можно кастомизировать до неузнаваемости."
      screenshot: "images/de/hyprland.png"
    - id: Sway
      name: "Sway"
      description: "A modern, highly efficient tiling Wayland compositor."
      description[ru]: "Современный, эффективный тайлинговый композитор Wayland."
      screenshot: "images/de/sway.png"
    - id: i3
      name: "i3"
      description: "A classic, incredibly fast tiling window manager for X11."
      description[ru]: "Классический, быстрый тайлинговый оконный менеджер для X11."
      screenshot: "images/de/i3.png"
    - id: Qtile
      name: "Qtile"
      description: "Written entirely in Python. Highly extensible and easy to modify."
      description[ru]: "Написан целиком на Python. Легко расширяется."
      screenshot: "images/de/qtile.png"
    - id: bspwm
      name: "bspwm"
      description: "A minimalist tiling window manager that arranges windows as the leaves of a binary tree."
      description[ru]: "Минималистичный тайлинговый оконный менеджер, окна в котором представлены в виде листьев бинарного дерева."
      screenshot: "images/de/bspwm.png"
    - id: Openbox
      name: "Openbox"
      description: "An incredibly lightweight floating window manager for X11. Highly configurable and offers a bare-bones environment."
      description[ru]: "Легковесный оконный менеджер для X11. Гибко настраивается и предлагает минималистичную среду."
      screenshot: "images/de/openbox.png"
    - id: Wayfire
      name: "Wayfire"
      description: "A 3D Wayland compositor powered by an extensive plugin architecture."
      description[ru]: "3D-композитор Wayland, оснащенный системой плагинов."
      screenshot: "images/de/wayfire.png"
    - id: Niri
      name: "Niri"
      description: "A unique scrollable-tiling Wayland compositor. It arranges windows in an infinite horizontal strip, allowing smooth panning."
      description[ru]: "Уникальный тайлинговый композитор Wayland со списочной прокруткой. Располагает окна бесконечной горизонтальной лентой, обеспечивая плавное перемещение."
      screenshot: "images/de/niri.png"
