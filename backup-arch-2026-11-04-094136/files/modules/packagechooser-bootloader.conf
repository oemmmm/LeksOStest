#
# LeksOS bootloader picker. The selected id is read by the bootloader module
# (efiBootLoaderVar = packagechooser_bootloader).
---
mode: required
method: legacy

labels:
    step: "Bootloader"
    step[ru]: "Загрузчик"

default: grub

items:
    - id: grub
      name: "GRUB"
      description: "The most widespread bootloader for Linux. Works on BIOS and UEFI, supports encrypted /boot."
      description[ru]: "Самый распространённый загрузчик для Linux. Работает в BIOS и UEFI, поддерживает зашифрованный /boot."
      screenshot: "images/bootloader/grub.png"
    - id: refind
      name: "rEFInd"
      efiOnly: true
      description: "Graphical bootloader that finds all systems automatically (UEFI only)."
      description[ru]: "Графический загрузчик, сам находит все системы (только для UEFI)."
      screenshot: "images/bootloader/refind.png"
    - id: limine
      name: "Limine"
      description: "Lightweight bootloader, supports partially BIOS and UEFI."
      description[ru]: "Современный лёгкий загрузчик, работает в BIOS (частично) и UEFI."
      screenshot: "images/bootloader/limine.png"
