---
dontChroot: false
timeout: 1200
script:
  - "-rm -f /etc/skel/Desktop/leksos-installer.desktop /home/*/Desktop/leksos-installer.desktop"
  - "-rm -f /home/*/Desktop/*calamares*.desktop /usr/share/applications/leksos-installer.desktop"
  - "-sed -i '/^GRUB_THEME=/d; /^GRUB_GFXMODE=/d' /etc/default/grub"
  - "-echo 'GRUB_THEME=/usr/share/grub/themes/leksos/theme.txt' >> /etc/default/grub"
  - "-echo 'GRUB_GFXMODE=1280x720x32,auto' >> /etc/default/grub"
  - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "-cp /usr/share/leksos/linux.preset.default /etc/mkinitcpio.d/linux.preset"
  - "-mkinitcpio -P"
  - "-/usr/local/bin/leksos-fix-boot"
  - "-grub-mkconfig -o /boot/grub/grub.cfg"
  - "-rm -f /etc/sudoers.d/g_wheel"
  - "-rm -f /etc/polkit-1/rules.d/49-nopasswd_global.rules"
  - "-rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/pacman-init.service"
  - "-rm -rf /etc/systemd/system/getty@tty1.service.d"
  - "-rm -f /etc/systemd/system/livecd-*.service /etc/plasmalogin.conf.d/autologin.conf"
  - "-install -d -o plasmalogin -g plasmalogin -m 750 /var/lib/plasmalogin"
  - "-install -d -o plasmalogin -g plasmalogin -m 755 /var/lib/plasmalogin/wallpapers"
  - "-install -o plasmalogin -g plasmalogin -m 644 /usr/share/wallpapers/leksos-wallpapers/ZOV.jpg /var/lib/plasmalogin/wallpapers/ZOV.jpg"
  - "-cp /usr/share/leksos/plasmalogin.conf.installed /etc/plasmalogin.conf"
  - "-rm -f /etc/modules-load.d/zfs.conf"
  - "-find /etc/systemd/system -xtype l -delete"
