#
# LeksOS override: trims the installed target down to a curated desktop
# instead of carrying over the full live/rescue package set from unpackfs.
# See /usr/share/calamares/modules/packages.conf (or the alci-calamares-config
# package) for the full format documentation.
---
backend: pacman

skip_if_no_internet: false
# The live image ships with no synced pacman databases (a fresh boot needs
# `pacman -Sy` too), so a target "installed by unsquashing" has none either.
# Without this, pacman fails with "database file for 'core' does not exist".
update_db: true
update_system: true

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true

operations:
  - install:
    # NOTE: "xorg" is a package GROUP in Arch. pacman prompts interactively
    # for group member selection ("Enter a selection (default=all)") and
    # --noconfirm does not suppress that prompt, which makes Calamares'
    # non-interactive pacman call fail. The core X stack (xorg-server,
    # xorg-xauth, xorg-setxkbmap, xorg-xrandr deps, etc.) already comes in
    # as a dependency of whichever DE/WM gets picked in the desktop
    # chooser (see netinstall-de.conf), so the "xorg" group isn't needed
    # here at all.
    - base-devel
    - linux-headers
    - ttf-ubuntu-font-family
    - ttf-hack
    - btop
    - scrcpy
  - try_remove:
    # DE-specific packages are NOT kept here anymore -- this file is meant
    # to leave a blank-slate target (no desktop, no display manager) and
    # let the desktop/display-manager/bootloader netinstall chooser pages
    # (netinstall-de.conf / netinstall-displaymanager.conf /
    # netinstall-bootloader.conf, run right after this "packages" job --
    # see settings.conf) reinstall exactly what the user actually checked.
    # Only DE-agnostic system glue (mesa, sudo, polkit, pipewire, network,
    # etc.) stays protected below.
    - calamares-leksos
    - plasma-login-manager
    - plasma-desktop
    - plasma-workspace
    - kwin
    - plasma-integration
    - plasma-nm
    - plasma-pa
    - polkit-kde-agent
    - konsole
